# Variante del workflow de publicación que construye el sitio con R en vez de Python.
# NO está activa: para usarla, copiala a .github/workflows/pages.yml (reemplazando la actual).
name: Publicar en GitHub Pages (R)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true          # paquetes precompilados: instala mucho más rápido
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::glue
            any::stringr
            any::rvest
            any::xml2
            any::dplyr
            any::tidyr
            any::purrr
            any::forcats
            any::ggplot2
            any::scales
      - run: Rscript construir.R
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deployment
        uses: actions/deploy-pages@v4
